<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>VitaQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="sprites.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "avatarState": "healthy",
  "islandCount": 3,
  "mapLayout": "scattered",
  "walkState": "thriving",
  "sleepState": "healthy",
  "screenState": "sick"
}/*EDITMODE-END*/;

// Wrap each screen in a phone shell — light theme matches seashell UI
function Phone({ children }) {
  return (
    <IOSDevice width={360} height={740}>
      <div style={{ height: '100%', width: '100%', position: 'relative', background: 'var(--vq-seashell)', overflow: 'hidden' }}>
        {children}
      </div>
    </IOSDevice>
  );
}

function App() {
  const [t, setT] = useTweaks(TWEAK_DEFAULTS);
  const [nudged, setNudged] = React.useState([]);

  const islandStates = {
    walk: t.walkState,
    sleep: t.sleepState,
    screen: t.screenState,
  };

  return (
    <>
      <DesignCanvas>
        <DCSection id="onboarding" title="Onboarding" subtitle="First-run flow — signup, HealthKit, avatar, habits">
          <DCArtboard id="signup" label="01 · Signup" width={360} height={740}>
            <Phone><OnboardingSignup /></Phone>
          </DCArtboard>
          <DCArtboard id="health" label="02 · HealthKit" width={360} height={740}>
            <Phone><OnboardingHealth /></Phone>
          </DCArtboard>
          <DCArtboard id="avatar" label="03 · Pick avatar" width={360} height={740}>
            <Phone><OnboardingAvatar selected={0} /></Phone>
          </DCArtboard>
          <DCArtboard id="avatar-alt" label="03b · Capybara selected" width={360} height={740}>
            <Phone><OnboardingAvatar selected={1} /></Phone>
          </DCArtboard>
          <DCArtboard id="habits" label="04 · Pick habits" width={360} height={740}>
            <Phone><OnboardingHabits selected={['sleep','steps','screen']} /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="landing" title="Landing (avatar closeup)" subtitle="PRD: land directly on avatar closeup every launch. Avatar reflects avg health.">
          <DCArtboard id="land-thriving" label="Thriving" width={360} height={740}>
            <Phone><LandingScreen avatarState="thriving" /></Phone>
          </DCArtboard>
          <DCArtboard id="land-healthy" label="Healthy" width={360} height={740}>
            <Phone><LandingScreen avatarState="healthy" /></Phone>
          </DCArtboard>
          <DCArtboard id="land-sick" label="Sick" width={360} height={740}>
            <Phone><LandingScreen avatarState="sick" /></Phone>
          </DCArtboard>
          <DCArtboard id="land-critical" label="Critical (the guilt)" width={360} height={740}>
            <Phone><LandingScreen avatarState="critical" /></Phone>
          </DCArtboard>
          <DCArtboard id="land-live" label="Live (from Tweaks)" width={360} height={740}>
            <Phone><LandingScreen avatarState={t.avatarState} /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="map" title="World Map" subtitle="Island per habit. Tap → avatar swims. Scattered vs linear layouts.">
          <DCArtboard id="map-scattered" label="Scattered · idle" width={360} height={740}>
            <Phone><MapScreen layout="scattered" islandStates={islandStates} /></Phone>
          </DCArtboard>
          <DCArtboard id="map-swim" label="Swimming → walk" width={360} height={740}>
            <Phone><MapScreen layout="scattered" islandStates={islandStates} avatarPos={{ island: 'walk' }} /></Phone>
          </DCArtboard>
          <DCArtboard id="map-linear" label="Linear layout" width={360} height={740}>
            <Phone><MapScreen layout="linear" islandStates={islandStates} /></Phone>
          </DCArtboard>
          <DCArtboard id="map-live" label="Live (from Tweaks)" width={360} height={740}>
            <Phone><MapScreen layout={t.mapLayout} islandStates={islandStates} /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="island" title="Island Detail" subtitle="Stats, 30-day streak grid, today's log. Shown for walk/sleep/screen across states.">
          <DCArtboard id="walk-thriving" label="Walk · thriving" width={360} height={740}>
            <Phone><IslandDetail islandKey="walk" state="thriving" /></Phone>
          </DCArtboard>
          <DCArtboard id="sleep-healthy" label="Sleep · healthy" width={360} height={740}>
            <Phone><IslandDetail islandKey="sleep" state="healthy" /></Phone>
          </DCArtboard>
          <DCArtboard id="screen-sick" label="Screen · sick" width={360} height={740}>
            <Phone><IslandDetail islandKey="screen" state="sick" /></Phone>
          </DCArtboard>
          <DCArtboard id="screen-critical" label="Screen · critical" width={360} height={740}>
            <Phone><IslandDetail islandKey="screen" state="critical" /></Phone>
          </DCArtboard>
        </DCSection>

        <DCSection id="friends" title="Friends" subtitle="List → visit their world → nudge.">
          <DCArtboard id="friends-list" label="Friends list" width={360} height={740}>
            <Phone><FriendsScreen nudged={nudged} /></Phone>
          </DCArtboard>
          <DCArtboard id="friend-visit" label="Visit yatharth" width={360} height={740}>
            <Phone><FriendVisitScreen friend={FRIENDS[2]} /></Phone>
          </DCArtboard>
          <DCArtboard id="friend-visit-crit" label="Visit kai (critical)" width={360} height={740}>
            <Phone><FriendVisitScreen friend={FRIENDS[4]} /></Phone>
          </DCArtboard>
          <DCArtboard id="friend-visit-thriving" label="Visit mira (thriving)" width={360} height={740}>
            <Phone><FriendVisitScreen friend={FRIENDS[3]} /></Phone>
          </DCArtboard>
        </DCSection>

        <DCPostIt top={30} right={80} rotate={3} width={220}>
          <b>VitaQuest</b> — pixel-art habit tracker. Avatar reflects habits across islands. Guilt + pride as the reward loop, not charts.
        </DCPostIt>
        <DCPostIt top={820} left={80} rotate={-2} width={200}>
          Avatar states: thriving → healthy → sick → critical. Toggle any island via <b>Tweaks ⚙</b>.
        </DCPostIt>
      </DesignCanvas>

      <TweaksPanel title="VitaQuest tweaks">
        <TweakSection label="Landing avatar" />
        <TweakRadio label="Avg health" value={t.avatarState}
          options={['thriving','healthy','sick','critical']}
          onChange={(v) => setT('avatarState', v)} />

        <TweakSection label="Island health" />
        <TweakRadio label="Walk" value={t.walkState}
          options={['thriving','healthy','sick','critical']}
          onChange={(v) => setT('walkState', v)} />
        <TweakRadio label="Sleep" value={t.sleepState}
          options={['thriving','healthy','sick','critical']}
          onChange={(v) => setT('sleepState', v)} />
        <TweakRadio label="Screen" value={t.screenState}
          options={['thriving','healthy','sick','critical']}
          onChange={(v) => setT('screenState', v)} />

        <TweakSection label="World map" />
        <TweakRadio label="Layout" value={t.mapLayout}
          options={['scattered','linear']}
          onChange={(v) => setT('mapLayout', v)} />
      </TweaksPanel>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
